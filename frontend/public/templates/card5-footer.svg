<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 80" width="760" height="80">
  <!-- METADATA: {
        "id": "5",
        "name": "Footer",
        "source": "manual",
        "controls": [
          { "key": "quote_1_text", "label": "quote_1_text", "type": "text", "default": "Code is like humor. When you have to explain it, its bad." },
          { "key": "quote_2_text", "label": "quote_2_text", "type": "text", "default": "Simplicity is prerequisite for reliability." },
          { "key": "quote_3_text", "label": "quote_3_text", "type": "text", "default": "Make it work, make it right, make it fast." },
          { "key": "heart_1_fill", "label": "heart_1_fill", "type": "color", "default": "#ff1744" },
          { "key": "heart_2_fill", "label": "heart_2_fill", "type": "color", "default": "#ff1744" },
          { "key": "heart_3_fill", "label": "heart_3_fill", "type": "color", "default": "#1a1a2e" },
          { "key": "heart_1_animation", "label": "heart_1_animation", "type": "select", "default": "<animateTransform attributeName='transform' type='scale' values='1;1.08;1' dur='1.2s' repeatCount='indefinite'/>", "options": [
            { "label": "None", "value": "" },
            { "label": "Pulse", "value": "<animateTransform attributeName='transform' type='scale' values='1;1.08;1' dur='1.2s' repeatCount='indefinite'/>" },
            { "label": "Blink", "value": "<animate attributeName='opacity' values='1;0;1' dur='1s' repeatCount='indefinite'/>" },
            { "label": "Fade", "value": "<animate attributeName='opacity' values='1;0.3;1' dur='2s' repeatCount='indefinite'/>" }
          ]},
          { "key": "heart_2_animation", "label": "heart_2_animation", "type": "select", "default": "<animate attributeName='opacity' values='1;0;1' dur='1s' repeatCount='indefinite'/>", "options": [
            { "label": "None", "value": "" },
            { "label": "Pulse", "value": "<animateTransform attributeName='transform' type='scale' values='1;1.08;1' dur='1.2s' repeatCount='indefinite'/>" },
            { "label": "Blink", "value": "<animate attributeName='opacity' values='1;0;1' dur='1s' repeatCount='indefinite'/>" },
            { "label": "Fade", "value": "<animate attributeName='opacity' values='1;0.3;1' dur='2s' repeatCount='indefinite'/>" }
          ]},
            { "label": "None", "value": "" },
          { "key": "heart_3_animation", "label": "heart_3_animation", "type": "select", "default": "", "options": [
            { "label": "Pulse", "value": "<animateTransform attributeName='transform' type='scale' values='1;1.08;1' dur='1.2s' repeatCount='indefinite'/>" },
            { "label": "Blink", "value": "<animate attributeName='opacity' values='1;0;1' dur='1s' repeatCount='indefinite'/>" },
            { "label": "Fade", "value": "<animate attributeName='opacity' values='1;0.3;1' dur='2s' repeatCount='indefinite'/>" }
          ]}
        ]
      } -->

  <!--
    CARD 5 — FOOTER | Neon Theme (red #ff1744)
    Tokens: {{quote_1_text}}, {{quote_2_text}}, {{quote_3_text}},
            {{heart_1_fill}}, {{heart_2_fill}}, {{heart_3_fill}},
            {{heart_1_animation}}, {{heart_2_animation}}, {{heart_3_animation}}
    Filled heart color for this theme: #ff1744  |  Empty: #1a1a2e

    QUOTE CYCLE: 3 quotes share one 12s loop (4s each: 0-4, 4-8, 8-12).
    Each quote types in (~1.2s), holds, then wipes out before the next begins.
    Reveal is done with a clipPath rect whose width is keyframed via <animate>.
    If a quote's char count changes, just adjust its <rect> width in the
    matching clipPath (roughly 8px per character at font-size 13) — the
    animate keyTimes below don't need to change.
  -->
  <style>
    .marquee { font-family: 'Courier New', Courier, monospace; font-weight: bold; letter-spacing: 4px; text-transform: uppercase; }
    .body    { font-family: ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    @keyframes blink { 0%,49.9%{opacity:1} 50%,100%{opacity:0} }
    .cursor { animation: blink 1s step-end infinite; }
  </style>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scan" patternUnits="userSpaceOnUse" width="760" height="4">
      <rect width="760" height="1" fill="white"/>
    </pattern>
    <clipPath id="mClip">
      <rect x="6" y="3" width="748" height="18"/>
    </clipPath>

    <!-- Typewriter reveal clips — one per quote, width animates 0 -> full -> 0 -->
    <clipPath id="qClip1">
      <rect x="30" y="40" height="20" width="0">
        <animate attributeName="width" values="0;0;700;700;0;0;0;0;0;0;0" keyTimes="0;0.02;0.10;0.29;0.33;0.40;0.60;0.70;0.90;0.99;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="qClip2">
      <rect x="30" y="40" height="20" width="0">
        <animate attributeName="width" values="0;0;0;0;0;700;700;0;0;0;0" keyTimes="0;0.33;0.35;0.36;0.43;0.62;0.63;0.66;0.90;0.99;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="qClip3">
      <rect x="30" y="40" height="20" width="0">
        <animate attributeName="width" values="0;0;0;700;700;0;0" keyTimes="0;0.667;0.687;0.767;0.957;0.997;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- ═══ FRAME ═══ -->
  <rect x="1" y="1" width="758" height="78" rx="6" ry="6" fill="#0a0a0f"/>
  <rect x="1" y="1" width="758" height="78" rx="6" ry="6" fill="none" stroke="#ff1744" stroke-width="1.5" filter="url(#glow)" opacity="0.5"/>
  <rect x="1" y="1" width="758" height="78" rx="6" ry="6" fill="none" stroke="#ff1744" stroke-width="1.5"/>
  <rect x="5" y="5" width="750" height="70" rx="4" ry="4" fill="none" stroke="#ff1744" stroke-width="0.5" opacity="0.2"/>

  <!-- ═══ MARQUEE ═══ -->
  <rect x="2" y="2" width="756" height="20" rx="5" fill="#ff1744" opacity="0.06"/>
  <line x1="6" y1="23" x2="754" y2="23" stroke="#ff1744" stroke-width="0.5" opacity="0.25"/>
  <g clip-path="url(#mClip)">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-760 0" dur="12s" repeatCount="indefinite"/>
      <text x="0" y="16" class="marquee" fill="#ff1744" font-size="13" opacity="0.8">♥ SYSTEM ONLINE ♥ SYSTEM ONLINE ♥ SYSTEM ONLINE ♥ SYSTEM ONLINE</text>
      <text x="760" y="16" class="marquee" fill="#ff1744" font-size="13" opacity="0.8">♥ SYSTEM ONLINE ♥ SYSTEM ONLINE ♥ SYSTEM ONLINE ♥ SYSTEM ONLINE ♥ SYSTEM ONLINE ♥ SYSTEM ONLINE </text>
    </g>
  </g>

  <!-- ═══ QUOTE 1 (0s - 4s) ═══ -->
  <g clip-path="url(#qClip1)">
    <text x="30" y="54" class="body" font-size="13">
      <tspan fill="#ff1744" opacity="0.7">&gt;&gt; </tspan>
      <tspan fill="#e0e0e0">{{quote_1_text}}</tspan>
      <tspan class="cursor" fill="#ff1744">&#x258E;</tspan>
    </text>
  </g>

  <!-- ═══ QUOTE 2 (4s - 8s) ═══ -->
  <g clip-path="url(#qClip2)">
    <text x="30" y="54" class="body" font-size="13">
      <tspan fill="#ff1744" opacity="0.7">&gt;&gt; </tspan>
      <tspan fill="#e0e0e0">{{quote_2_text}}</tspan>
      <tspan class="cursor" fill="#ff1744">&#x258E;</tspan>
    </text>
  </g>

  <!-- ═══ QUOTE 3 (8s - 12s) ═══ -->
  <g clip-path="url(#qClip3)">
    <text x="30" y="54" class="body" font-size="13">
      <tspan fill="#ff1744" opacity="0.7">&gt;&gt; </tspan>
      <tspan fill="#e0e0e0">{{quote_3_text}}</tspan>
      <tspan class="cursor" fill="#ff1744">&#x258E;</tspan>
    </text>
  </g>

  <!-- ═══ HEARTS ═══ -->
  <g transform="translate(668,42)">
    <g>{{heart_1_animation}}
      <path transform="translate(-8,-7)" d="M8,14 C5,11 0,7.5 0,4 C0,1.5 1.5,0 4,0 C5.5,0 7,1 8,2.5 C9,1 10.5,0 12,0 C14.5,0 16,1.5 16,4 C16,7.5 11,11 8,14Z" fill="{{heart_1_fill}}"/>
    </g>
  </g>
  <g transform="translate(694,42)">
    <g>
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      <path transform="translate(-8,-7)" d="M8,14 C5,11 0,7.5 0,4 C0,1.5 1.5,0 4,0 C5.5,0 7,1 8,2.5 C9,1 10.5,0 12,0 C14.5,0 16,1.5 16,4 C16,7.5 11,11 8,14Z" fill="{{heart_2_fill}}"/>
    </g>
  </g>
  <g transform="translate(720,42)">
    <g>{{heart_3_animation}}
      <path transform="translate(-8,-7)" d="M8,14 C5,11 0,7.5 0,4 C0,1.5 1.5,0 4,0 C5.5,0 7,1 8,2.5 C9,1 10.5,0 12,0 C14.5,0 16,1.5 16,4 C16,7.5 11,11 8,14Z" fill="{{heart_3_fill}}"/>
    </g>
  </g>

  <!-- ═══ SCANLINES ═══ -->
  <rect x="2" y="2" width="756" height="76" rx="5" fill="url(#scan)" opacity="0.035"/>
</svg>