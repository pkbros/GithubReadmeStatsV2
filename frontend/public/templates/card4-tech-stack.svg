<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220">
  <!-- METADATA: {
        "id": "4",
        "name": "Tech Stack",
        "source": "github_api",
        "description": "Auto-populated from GitHub. Shows top 5 languages by usage.",
        "controls": []
      } -->

  <!--
    CARD 4 — TECH STACK | Neon Theme (green #39ff14)

    DYNAMIC EXPANSION (same formula as RPG theme, adjusted for marquee strip):
      card_height = 68 + lang_count × 28
      text_y(i)   = 52 + i × 28   (0-indexed)
      line_y(i)   = 49 + i × 28
      anim begin  = (i × 0.15) + "s"

      Frame tokens: outer_h=card_height-2, inner_h=card_height-10

    Per-row tokens:
      {{lang_N_name}}, {{lang_N_pct}}, {{lang_N_color}},
      {{lang_N_dashoffset}} = 440 - (pct/100 × 440)

    Bars are stroked lines (stroke-dasharray=440, animate stroke-dashoffset).
  -->
  <style>
    .marquee { font-family: 'Courier New', Courier, monospace; font-weight: bold; letter-spacing: 4px; text-transform: uppercase; }
    .body    { font-family: ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
  </style>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="barGlow" x="-5%" y="-100%" width="110%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scan" patternUnits="userSpaceOnUse" width="760" height="4">
      <rect width="760" height="1" fill="white"/>
    </pattern>
    <clipPath id="mClip">
      <rect x="6" y="3" width="748" height="20"/>
    </clipPath>
  </defs>

  <!-- ═══ FRAME ═══ -->
  <rect x="1" y="1" width="758" height="218" rx="6" ry="6" fill="#0a0a0f"/>
  <rect x="1" y="1" width="758" height="218" rx="6" ry="6" fill="none" stroke="#39ff14" stroke-width="1.5" filter="url(#glow)" opacity="0.5"/>
  <rect x="1" y="1" width="758" height="218" rx="6" ry="6" fill="none" stroke="#39ff14" stroke-width="1.5"/>
  <rect x="5" y="5" width="750" height="210" rx="4" ry="4" fill="none" stroke="#39ff14" stroke-width="0.5" opacity="0.2"/>

  <!-- ═══ MARQUEE ═══ -->
  <rect x="2" y="2" width="756" height="22" rx="5" fill="#39ff14" opacity="0.06"/>
  <line x1="6" y1="25" x2="754" y2="25" stroke="#39ff14" stroke-width="0.5" opacity="0.25"/>
  <g clip-path="url(#mClip)">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-760 0" dur="12s" repeatCount="indefinite"/>
      <text x="0" y="18" class="marquee" fill="#39ff14" font-size="12" opacity="0.8">★ T ECH STACK ★ TECH STACK ★ TECH STACK ★ TECH STACK ★ TECH STACK </text>
      <text x="760" y="18" class="marquee" fill="#39ff14" font-size="12" opacity="0.8">★ TECH STACK ★ TECH STACK ★ TECH STACK ★ TECH STACK ★ TECH STACK ★ TECH STACK ★ TECH STACK </text>
    </g>
  </g>

  <!-- ═══ ROW 1 (i=0) ═══ -->
  <text x="30" y="52" class="body" fill="#e0e0e0" font-size="13">{{lang_1_name}}</text>
  <line x1="180" y1="49" x2="620" y2="49" stroke="#1a1a2e" stroke-width="4" stroke-linecap="round"/>
  <line x1="180" y1="49" x2="620" y2="49" stroke="{{lang_1_color}}" stroke-width="3" stroke-linecap="round" stroke-dasharray="440" stroke-dashoffset="440" filter="url(#barGlow)">
    <animate attributeName="stroke-dashoffset" from="440" to="{{lang_1_dashoffset}}" dur="1s" fill="freeze" begin="0s" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </line>
  <text x="720" y="52" class="body" fill="#e0e0e0" font-size="13" font-weight="bold" text-anchor="end">{{lang_1_pct}}%</text>

  <!-- ═══ ROW 2 (i=1) ═══ -->
  <text x="30" y="80" class="body" fill="#e0e0e0" font-size="13">{{lang_2_name}}</text>
  <line x1="180" y1="77" x2="620" y2="77" stroke="#1a1a2e" stroke-width="4" stroke-linecap="round"/>
  <line x1="180" y1="77" x2="620" y2="77" stroke="{{lang_2_color}}" stroke-width="3" stroke-linecap="round" stroke-dasharray="440" stroke-dashoffset="440" filter="url(#barGlow)">
    <animate attributeName="stroke-dashoffset" from="440" to="{{lang_2_dashoffset}}" dur="1s" fill="freeze" begin="0.15s" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </line>
  <text x="720" y="80" class="body" fill="#e0e0e0" font-size="13" font-weight="bold" text-anchor="end">{{lang_2_pct}}%</text>

  <!-- ═══ ROW 3 (i=2) ═══ -->
  <text x="30" y="108" class="body" fill="#e0e0e0" font-size="13">{{lang_3_name}}</text>
  <line x1="180" y1="105" x2="620" y2="105" stroke="#1a1a2e" stroke-width="4" stroke-linecap="round"/>
  <line x1="180" y1="105" x2="620" y2="105" stroke="{{lang_3_color}}" stroke-width="3" stroke-linecap="round" stroke-dasharray="440" stroke-dashoffset="440" filter="url(#barGlow)">
    <animate attributeName="stroke-dashoffset" from="440" to="{{lang_3_dashoffset}}" dur="1s" fill="freeze" begin="0.3s" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </line>
  <text x="720" y="108" class="body" fill="#e0e0e0" font-size="13" font-weight="bold" text-anchor="end">{{lang_3_pct}}%</text>

  <!-- ═══ ROW 4 (i=3) ═══ -->
  <text x="30" y="136" class="body" fill="#e0e0e0" font-size="13">{{lang_4_name}}</text>
  <line x1="180" y1="133" x2="620" y2="133" stroke="#1a1a2e" stroke-width="4" stroke-linecap="round"/>
  <line x1="180" y1="133" x2="620" y2="133" stroke="{{lang_4_color}}" stroke-width="3" stroke-linecap="round" stroke-dasharray="440" stroke-dashoffset="440" filter="url(#barGlow)">
    <animate attributeName="stroke-dashoffset" from="440" to="{{lang_4_dashoffset}}" dur="1s" fill="freeze" begin="0.45s" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </line>
  <text x="720" y="136" class="body" fill="#e0e0e0" font-size="13" font-weight="bold" text-anchor="end">{{lang_4_pct}}%</text>

  <!-- ═══ ROW 5 (i=4) ═══ -->
  <text x="30" y="164" class="body" fill="#e0e0e0" font-size="13">{{lang_5_name}}</text>
  <line x1="180" y1="161" x2="620" y2="161" stroke="#1a1a2e" stroke-width="4" stroke-linecap="round"/>
  <line x1="180" y1="161" x2="620" y2="161" stroke="{{lang_5_color}}" stroke-width="3" stroke-linecap="round" stroke-dasharray="440" stroke-dashoffset="440" filter="url(#barGlow)">
    <animate attributeName="stroke-dashoffset" from="440" to="{{lang_5_dashoffset}}" dur="1s" fill="freeze" begin="0.6s" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </line>
  <text x="720" y="164" class="body" fill="#e0e0e0" font-size="13" font-weight="bold" text-anchor="end">{{lang_5_pct}}%</text>

  <!-- ═══ SCANLINES ═══ -->
  <rect x="2" y="2" width="756" height="216" rx="5" fill="url(#scan)" opacity="0.035"/>
</svg>
