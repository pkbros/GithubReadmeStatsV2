<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 80" width="760" height="80">
  <!--
    CARD 5 — FOOTER | Neon Theme (red #ff1744)
    Tokens: {{quote_text}}, {{heart_1_fill}}, {{heart_2_fill}}, {{heart_3_fill}},
            {{heart_1_animation}}, {{heart_2_animation}}, {{heart_3_animation}}
    Filled heart color for this theme: #ff1744  |  Empty: #1a1a2e
  -->
  <style>
    .marquee { font-family: 'Courier New', Courier, monospace; font-weight: bold; letter-spacing: 4px; text-transform: uppercase; }
    .body    { font-family: ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    @keyframes blink { 0%,49.9%{opacity:1} 50%,100%{opacity:0} }
    .cursor { animation: blink 1s step-end infinite; }
  </style>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" patternUnits="userSpaceOnUse" width="760" height="4">
      <rect width="760" height="1" fill="white"/>
    </pattern>
    <clipPath id="mClip"><rect x="6" y="3" width="748" height="18"/></clipPath>
  </defs>

  <!-- ═══ FRAME ═══ -->
  <rect x="1" y="1" width="758" height="78" rx="6" ry="6" fill="#0a0a0f"/>
  <rect x="1" y="1" width="758" height="78" rx="6" ry="6" fill="none" stroke="#ff1744" stroke-width="1.5" filter="url(#glow)" opacity="0.5"/>
  <rect x="1" y="1" width="758" height="78" rx="6" ry="6" fill="none" stroke="#ff1744" stroke-width="1.5"/>
  <rect x="5" y="5" width="750" height="70" rx="4" ry="4" fill="none" stroke="#ff1744" stroke-width="0.5" opacity="0.2"/>

  <!-- ═══ MARQUEE ═══ -->
  <rect x="2" y="2" width="756" height="20" rx="5" fill="#ff1744" opacity="0.06"/>
  <line x1="6" y1="23" x2="754" y2="23" stroke="#ff1744" stroke-width="0.5" opacity="0.25"/>
  <g clip-path="url(#mClip)">
    <g><animateTransform attributeName="transform" type="translate" from="0 0" to="-760 0" dur="12s" repeatCount="indefinite"/>
      <text x="0" y="16" class="marquee" fill="#ff1744" font-size="13" opacity="0.8">♥ SYSTEM ONLINE ♥ SYSTEM ONLINE ♥ SYSTEM ONLINE ♥ SYSTEM ONLINE</text>
      <text x="760" y="16" class="marquee" fill="#ff1744" font-size="13" opacity="0.8">♥ SYSTEM ONLINE ♥ SYSTEM ONLINE ♥ SYSTEM ONLINE ♥ SYSTEM ONLINE ♥ SYSTEM ONLINE ♥ SYSTEM ONLINE </text>
    </g>
  </g>

  <!-- ═══ QUOTE ═══ -->
  <text x="30" y="54" class="body" font-size="13">
    <tspan fill="#ff1744" opacity="0.7">&gt;&gt; </tspan>
    <tspan fill="#e0e0e0">{{quote_text}}</tspan>
    <tspan class="cursor" fill="#ff1744">&#x258E;</tspan>
  </text>

  <!-- ═══ HEARTS ═══ -->
  <g transform="translate(668,42)">
    <g>{{heart_1_animation}}
      <path transform="translate(-8,-7)" d="M8,14 C5,11 0,7.5 0,4 C0,1.5 1.5,0 4,0 C5.5,0 7,1 8,2.5 C9,1 10.5,0 12,0 C14.5,0 16,1.5 16,4 C16,7.5 11,11 8,14Z" fill="{{heart_1_fill}}"/>
    </g>
  </g>
  <g transform="translate(694,42)">
    <g>{{heart_2_animation}}
      <path transform="translate(-8,-7)" d="M8,14 C5,11 0,7.5 0,4 C0,1.5 1.5,0 4,0 C5.5,0 7,1 8,2.5 C9,1 10.5,0 12,0 C14.5,0 16,1.5 16,4 C16,7.5 11,11 8,14Z" fill="{{heart_2_fill}}"/>
    </g>
  </g>
  <g transform="translate(720,42)">
    <g>{{heart_3_animation}}
      <path transform="translate(-8,-7)" d="M8,14 C5,11 0,7.5 0,4 C0,1.5 1.5,0 4,0 C5.5,0 7,1 8,2.5 C9,1 10.5,0 12,0 C14.5,0 16,1.5 16,4 C16,7.5 11,11 8,14Z" fill="{{heart_3_fill}}"/>
    </g>
  </g>

  <!-- ═══ SCANLINES ═══ -->
  <rect x="2" y="2" width="756" height="76" rx="5" fill="url(#scan)" opacity="0.035"/>
</svg>
